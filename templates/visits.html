{% extends "base.html" %}

{% block title %}PawCare | Record Visit{% endblock %}

{% block content %}
<section class="mb-4">
    <div class="row align-items-center">
        <div class="col-md-8">
            <h1 class="mb-1">Record Clinic Visit</h1>
            <p class="text-muted mb-0">Select a patient and record clinic attendance.</p>
        </div>
        <div class="col-md-4 text-md-end mt-3 mt-md-0">
            <a class="btn btn-primary" href="{{ url_for('index') }}">New Patient</a>
        </div>
    </div>
</section>

<section class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-4 p-lg-5">
        <div id="visitSuccess" class="alert alert-success d-none" role="status" aria-live="polite"></div>
        <div id="visitError" class="alert alert-danger d-none" role="alert"></div>
        <form id="visitForm" novalidate>
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="mb-3">
                        <label class="form-label" for="patientSelect">Patient <span class="text-danger">*</span></label>
                        <select class="form-select" id="patientSelect" name="patient_id" required>
                            <option value="">Loading patients...</option>
                        </select>
                        <div class="invalid-feedback" id="patient_id_error"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="visitDate">Visit Date <span class="text-danger">*</span></label>
                        <input class="form-control" id="visitDate" name="date" type="date" required>
                        <div class="invalid-feedback" id="date_error"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="visitType">Visit Type <span class="text-danger">*</span></label>
                        <select class="form-select" id="visitType" name="visit_type" required>
                            <option value="">Choose visit type</option>
                            <option value="Annual checkup">Annual checkup</option>
                            <option value="Vaccination booster">Vaccination booster</option>
                            <option value="Surgery follow-up">Surgery follow-up</option>
                            <option value="Spay/Neuter">Spay/Neuter</option>
                            <option value="Consultation">Consultation</option>
                            <option value="Emergency">Emergency</option>
                        </select>
                        <div class="invalid-feedback" id="visit_type_error"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="visitTime">Visit Time <span class="text-danger">*</span></label>
                        <input class="form-control" id="visitTime" name="time" type="time" required>
                        <div class="invalid-feedback" id="time_error"></div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-3">
                        <label class="form-label" for="visitNotes">Notes</label>
                        <textarea class="form-control" id="visitNotes" name="notes" rows="7" maxlength="200" aria-describedby="notesCounter notes_error" placeholder="Add notes for the visit..."></textarea>
                        <div class="d-flex justify-content-between">
                            <div class="invalid-feedback" id="notes_error"></div>
                            <small class="form-text" id="notesCounter" aria-live="polite">0 / 200</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-12 text-end">
                    <button type="reset" class="btn btn-secondary me-2">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Visit</button>
                </div>
            </div>
        </form>
    </div>
</section>

<section class="mt-4 border rounded-3 bg-white p-3 shadow-sm">
    <h2 class="h4 text-primary">Recent Visits</h2>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th scope="col">Date</th>
                    <th scope="col">Time</th>
                    <th scope="col">Pet Name</th>
                    <th scope="col">Owner</th>
                    <th scope="col">Visit Type</th>
                </tr>
            </thead>
            <tbody id="upcomingVisits"></tbody>
        </table>
    </div>
</section>
{% endblock %}

{% block page_scripts %}
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>
<script src="{{ url_for('static', filename='js/visit-form.js') }}"></script>
{% endblock %}
