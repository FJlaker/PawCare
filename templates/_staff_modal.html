<div class="modal fade" id="staffNameModal" tabindex="-1" aria-labelledby="staffNameTitle" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <form id="staffNameForm" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="staffNameTitle">Staff name</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label" for="staffNameInput">Your name</label>
                    <input class="form-control" id="staffNameInput" name="staff_name" autocomplete="name" aria-describedby="staffNameError" required>
                    <div class="invalid-feedback" id="staffNameError"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save name</button>
                </div>
            </form>
        </div>
    </div>
</div>
